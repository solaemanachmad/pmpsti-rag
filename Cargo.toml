[package]
name = "pmpsti"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-native-tls", "uuid"] }
pgvector = { version = "0.3", features = ["sqlx"] }
dotenvy = "0.15"
log = "0.4.29"
env_logger = "0.11.10"

serde = "1.0.228"
serde_json = "1.0.149"
anyhow = "1.0.102"
reqwest = { version = "0.13.2", features = ["json"] }
actix-files = "0.6.10"
chrono = "0.4.44"
uuid = { version = "1.23.0", features = ["v4"] }
rand = "0.10.0"
argon2 = "0.5"
jsonwebtoken = "9"
actix-cors = "0.7.1"
dashmap = "6"
scraper = "0.22"
actix-multipart = "0.7"
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.10"