# Keeps the backend on Render's free plan awake. Render stops a free service after 15 minutes
# without requests, and the next question then waits ~50 s while it starts again.
#
# /health does not touch the database, so Neon still sleeps when idle (its free compute hours
# stay unused); the first question after a quiet period wakes Neon in about a second.
#
# Notes:
# - One always-on free service uses ~744 of Render's 750 free instance hours per month.
#   With a second free Render service, the hours run out before the month ends.
# - GitHub may start scheduled runs a few minutes late, and it pauses schedules in a public
#   repository after 60 days without commits (re-enable under Actions → Keep backend awake).
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://pmpsti-rag.onrender.com/health; then exit 0; fi
            sleep 10
          done
          echo "::warning::Backend did not answer /health"
